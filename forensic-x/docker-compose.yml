# FORENSIC-X — Docker-compose for development environment
# ============================================================
#
# Services:
#   forensic-x-api   — FastAPI application
#   postgres          — PostgreSQL 16 database
#   redis             — Redis 7 (sessions + rate limiting)
#   nginx             — Reverse proxy
#
# Start:  docker compose up --build
# Stop:   docker compose down
# Wipe:   docker compose down -v

version: "3.9"

services:

  # ── PostgreSQL ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: forensicx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: forensicx_db
      POSTGRES_USER: forensicx
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forensicx_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forensicx -d forensicx_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - forensicx-net

  # ── Redis ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: forensicx-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-forensicx_redis_dev}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-forensicx_redis_dev}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - forensicx-net

  # ── FastAPI Application ───────────────────────────────────────
  forensic-x-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: forensicx-api
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      DATABASE_URL: postgresql+asyncpg://forensicx:${POSTGRES_PASSWORD:-forensicx_dev_password}@postgres:5432/forensicx_db
      REDIS_URL: redis://:${REDIS_PASSWORD:-forensicx_redis_dev}@redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-CHANGE_ME_IN_PRODUCTION}
      JWT_SECRET: ${JWT_SECRET:-CHANGE_ME_IN_PRODUCTION}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@forensicx.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-AdminPassword123!}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ALLOWED_HOSTS: "localhost,nginx,forensicx-api"
      CORS_ORIGINS: "http://localhost,http://localhost:80,http://localhost:8080"
    volumes:
      - evidence_store:/app/evidence_store
      - reports_store:/app/reports_store
      - logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - forensicx-net
    expose:
      - "8000"

  # ── Nginx Reverse Proxy ───────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: forensicx-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./app/static:/var/www/static:ro
      - logs:/var/log/nginx
    depends_on:
      forensic-x-api:
        condition: service_healthy
    networks:
      - forensicx-net

# ── Volumes ──────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  evidence_store:
    driver: local
  reports_store:
    driver: local
  logs:
    driver: local

# ── Networks ─────────────────────────────────────────────────
networks:
  forensicx-net:
    driver: bridge
